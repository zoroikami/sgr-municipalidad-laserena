{% extends 'base.html' %}
{% block title %}Iniciar sesión | SGR{% endblock %}
{% block content %}
<section class="account-section" aria-labelledby="account-title">
  <h1 id="account-title">Iniciar sesión</h1>
  <p>Ingresa con tu cuenta del Sistema de Gestión de Resultados.</p>
  <form method="post">
    {% csrf_token %}{% include 'cuentas/_fields.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Ingresar</button>
  </form>
  <p class="mt-3"><a href="{% url 'cuentas:password_reset' %}">Recuperar contraseña</a></p>
</section>
{% endblock %}
