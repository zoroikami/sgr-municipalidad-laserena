  <g transform="translate(320, 565)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <text x="140" y="28" fill="#78350f" font-size="11" font-weight="700" text-anchor="middle">CU-07: Actualizar Estado en</text>
    <text x="140" y="42" fill="#78350f" font-size="10.5" text-anchor="middle">Tubo de Trabajo (4 Estados)</text>
  </g>

  <!-- CU-08: Motor de Semáforo Diario -->
  <g transform="translate(710, 395)">
    <ellipse cx="145" cy="32" rx="140" ry="28" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" />
    <text x="145" y="28" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">CU-08: Calcular Avance Ponderado</text>
    <text x="145" y="42" fill="#064e3b" font-size="10.5" text-anchor="middle">y Semáforo Diario (Verde/Ámbar/Rojo)</text>
  </g>

  <!-- Inclusión CU-04 -> CU-08 -->
  <path d="M 580 342 L 720 405" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dashArrow)" />
  <text x="645" y="365" fill="#1d4ed8" font-size="9.5" font-weight="700">«include»</text>

