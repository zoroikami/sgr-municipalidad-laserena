  <!-- CU-01: Autenticación -->
  <g transform="translate(320, 140)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="140" y="28" fill="#1e3a8a" font-size="11" font-weight="700" text-anchor="middle">CU-01: Autenticar Usuario y</text>
    <text x="140" y="42" fill="#1e3a8a" font-size="10.5" text-anchor="middle">Controlar Sesión por Rol</text>
  </g>

  <!-- CU-02: Registrar Actividad -->
  <g transform="translate(320, 225)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="140" y="28" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">CU-02: Registrar Actividad en Terreno</text>
    <text x="140" y="42" fill="#14532d" font-size="10.5" text-anchor="middle">con Evidencia Fotográfica</text>
  </g>

