<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1020" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,2 9,5 0,8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Banner Superior Institucional -->
  <rect x="0" y="0" width="1450" height="65" fill="url(#gradHeader)" />
  <text x="30" y="30" fill="#ffffff" font-size="19" font-weight="700">ILUSTRE MUNICIPALIDAD DE LA SERENA - SISTEMA DE GESTIÓN DE RESULTADOS (SGR)</text>
  <text x="30" y="50" fill="#bae6fd" font-size="12.5">DIAGRAMA GENERAL DE CASOS DE USO (ALTO NIVEL / UML 2.5) | DIRECCIÓN DE SERVICIOS COMUNITARIOS (DISERCO)</text>
  <text x="1420" y="40" fill="#ffffff" font-size="12" text-anchor="end" font-weight="600">INACAP - PROF. JORGE CORTÉS</text>

  <!-- LÍMITE DEL SISTEMA (SYSTEM BOUNDARY) -->
  <rect x="270" y="90" width="880" height="880" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#shadow)" />
  <rect x="270" y="90" width="880" height="36" rx="16" fill="#eff6ff" />
  <text x="710" y="114" fill="#1e40af" font-size="13.5" font-weight="800" text-anchor="middle">SISTEMA DE GESTIÓN DE RESULTADOS SGR - MUNICIPALIDAD DE LA SERENA (LÍMITE DEL SISTEMA)</text>

  <!-- ACTORES DEL LADO IZQUIERDO (PRIMARIOS) -->

  <!-- Actor 1: Funcionario Territorial -->
  <g transform="translate(40, 160)">
    <circle cx="60" cy="30" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#1d4ed8" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#1e3a8a" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Funcionario</text>
    <text x="60" y="159" fill="#93c5fd" font-size="9.5" text-anchor="middle">Territorial (DISERCO)</text>
  </g>

  <!-- Actor 2: Gestor Social -->
  <g transform="translate(40, 360)">
    <circle cx="60" cy="30" r="18" fill="#fce7f3" stroke="#be185d" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#be185d" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#be185d" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#be185d" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#be185d" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#831843" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Gestor Social</text>
    <text x="60" y="159" fill="#fbcfe8" font-size="9.5" text-anchor="middle">Municipal</text>
  </g>

  <!-- Actor 3: Verificador Técnico -->
  <g transform="translate(40, 560)">
    <circle cx="60" cy="30" r="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#7e22ce" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#7e22ce" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#7e22ce" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#7e22ce" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#581c87" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Verificador</text>
    <text x="60" y="159" fill="#e9d5ff" font-size="9.5" text-anchor="middle">Técnico Municipal</text>
  </g>

  <!-- Actor 4: Delegado Municipal -->
  <g transform="translate(40, 760)">
    <circle cx="60" cy="30" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#b45309" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#b45309" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#b45309" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#b45309" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#78350f" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Delegado</text>
    <text x="60" y="159" fill="#fde68a" font-size="9.5" text-anchor="middle">Municipal (6 Del.)</text>
  </g>

  <!-- ACTORES DEL LADO DERECHO -->

  <!-- Actor 5: Supervisor DISERCO -->
  <g transform="translate(1260, 200)">
    <circle cx="60" cy="30" r="18" fill="#e0e7ff" stroke="#3730a3" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#3730a3" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#3730a3" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#3730a3" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#3730a3" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#312e81" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Supervisor</text>
    <text x="60" y="159" fill="#c7d2fe" font-size="9.5" text-anchor="middle">Central DISERCO</text>
  </g>

  <!-- Actor 6: Administrador Central -->
  <g transform="translate(1260, 470)">
    <circle cx="60" cy="30" r="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#b91c1c" stroke-width="2.5" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#b91c1c" stroke-width="2.5" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#b91c1c" stroke-width="2.5" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#b91c1c" stroke-width="2.5" />
    <rect x="0" y="132" width="120" height="34" rx="6" fill="#7f1d1d" />
    <text x="60" y="146" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Administrador</text>
    <text x="60" y="159" fill="#fca5a5" font-size="9.5" text-anchor="middle">Central TI / SGR</text>
  </g>

  <!-- Actor 7: Vecino / Dirigente Comunitario (Secundario) -->
  <g transform="translate(1260, 740)">
    <circle cx="60" cy="30" r="18" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" />
    <line x1="60" y1="48" x2="60" y2="90" stroke="#475569" stroke-width="2.5" stroke-dasharray="4,3" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#475569" stroke-width="2.5" stroke-dasharray="4,3" />
    <line x1="60" y1="90" x2="35" y2="125" stroke="#475569" stroke-width="2.5" stroke-dasharray="4,3" />
    <line x1="60" y1="90" x2="85" y2="125" stroke="#475569" stroke-width="2.5" stroke-dasharray="4,3" />
