  <g transform="translate(320, 480)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <text x="140" y="28" fill="#78350f" font-size="11" font-weight="700" text-anchor="middle">CU-06: Crear Compromiso en</text>
    <text x="140" y="42" fill="#78350f" font-size="10.5" text-anchor="middle">Agenda Colectiva Territorial</text>
