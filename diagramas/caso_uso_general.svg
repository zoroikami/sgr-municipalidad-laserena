  <g transform="translate(680, 225)">
    <ellipse cx="130" cy="32" rx="125" ry="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="130" y="28" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">CU-03: Generar Código Único</text>
    <text x="130" y="42" fill="#14532d" font-size="10.5" text-anchor="middle">EVI-2026-XXXX</text>
  </g>

  <!-- Inclusión CU-02 -> CU-03 -->
  <path d="M 580 257 L 680 257" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dashArrow)" />
  <text x="630" y="250" fill="#1d4ed8" font-size="9.5" font-weight="700" text-anchor="middle">«include»</text>

  <!-- CU-04: Validar Evidencia -->
  <g transform="translate(320, 310)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.8" />
    <text x="140" y="28" fill="#701a75" font-size="11" font-weight="700" text-anchor="middle">CU-04: Validar y Dictaminar</text>
    <text x="140" y="42" fill="#701a75" font-size="10.5" text-anchor="middle">Evidencia Fotográfica</text>
  </g>

  <!-- CU-05: Atención Social Multietapa -->
  <g transform="translate(320, 395)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8" />
    <text x="140" y="28" fill="#881337" font-size="11" font-weight="700" text-anchor="middle">CU-05: Registrar Atención Social</text>
    <text x="140" y="42" fill="#881337" font-size="10.5" text-anchor="middle">Multietapa (Máximo 3 Gestiones)</text>
  </g>

