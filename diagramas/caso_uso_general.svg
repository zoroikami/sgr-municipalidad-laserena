  <g transform="translate(710, 480)">
    <ellipse cx="145" cy="32" rx="140" ry="28" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8" />
    <text x="145" y="28" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle">CU-09: Consultar Tablero Consolidado</text>
    <text x="145" y="42" fill="#312e81" font-size="10.5" text-anchor="middle">y Reportería Territorial</text>
  </g>

  <!-- CU-10: Configuración de Metas -->
  <g transform="translate(320, 680)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" />
    <text x="140" y="28" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">CU-10: Configurar Período, Metas</text>
    <text x="140" y="42" fill="#0f172a" font-size="10.5" text-anchor="middle">y Ponderadores al 100%</text>
  </g>

  <!-- CU-11: Catálogos de Servicios -->
  <g transform="translate(320, 765)">
    <ellipse cx="140" cy="32" rx="130" ry="28" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" />
    <text x="140" y="28" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">CU-11: Administrar Catálogos,</text>
    <text x="140" y="42" fill="#0f172a" font-size="10.5" text-anchor="middle">Cargos y 6 Delegaciones</text>
  </g>

  <!-- CU-12: Auditoría Inmutable -->
  <g transform="translate(710, 765)">
    <ellipse cx="145" cy="32" rx="140" ry="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" />
    <text x="145" y="28" fill="#7f1d1d" font-size="11" font-weight="700" text-anchor="middle">CU-12: Auditar Bitácora Inmutable</text>
    <text x="145" y="42" fill="#7f1d1d" font-size="10.5" text-anchor="middle">y Trazabilidad Transversal</text>
  </g>

  <!-- LÍNEAS DE ASOCIACIÓN ENTRE ACTORES Y CASOS DE USO -->

  <!-- Funcionario Territorial -->
  <line x1="160" y1="210" x2="330" y2="172" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="210" x2="330" y2="257" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="210" x2="330" y2="512" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="210" x2="330" y2="597" stroke="#475569" stroke-width="1.6" />

  <!-- Gestor Social -->
  <line x1="160" y1="410" x2="330" y2="172" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="410" x2="330" y2="427" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="410" x2="330" y2="512" stroke="#475569" stroke-width="1.6" />

  <!-- Verificador Técnico -->
  <line x1="160" y1="610" x2="330" y2="172" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="610" x2="330" y2="342" stroke="#475569" stroke-width="1.6" />

  <!-- Delegado Municipal -->
  <line x1="160" y1="810" x2="330" y2="512" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="810" x2="330" y2="597" stroke="#475569" stroke-width="1.6" />
  <line x1="160" y1="810" x2="710" y2="512" stroke="#475569" stroke-width="1.6" />

  <!-- Supervisor DISERCO -->
  <line x1="1260" y1="250" x2="990" y2="427" stroke="#475569" stroke-width="1.6" />
  <line x1="1260" y1="250" x2="990" y2="512" stroke="#475569" stroke-width="1.6" />
  <line x1="1260" y1="250" x2="990" y2="797" stroke="#475569" stroke-width="1.6" />

  <!-- Administrador Central -->
  <line x1="1260" y1="520" x2="590" y2="712" stroke="#475569" stroke-width="1.6" />
  <line x1="1260" y1="520" x2="590" y2="797" stroke="#475569" stroke-width="1.6" />
  <line x1="1260" y1="520" x2="720" y2="797" stroke="#475569" stroke-width="1.6" />

  <!-- Vecino (Secundario - Participa solicitando o recibiendo atención) -->
  <line x1="1260" y1="790" x2="600" y2="427" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="1260" y1="790" x2="600" y2="512" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="930" y="445" fill="#64748b" font-size="9.5">«recibe atención»</text>
  <text x="930" y="530" fill="#64748b" font-size="9.5">«plantea compromiso»</text>

  <!-- Pie de Diagrama -->
  <rect x="270" y="980" width="880" height="26" rx="4" fill="#0f172a" />
  <text x="285" y="997" fill="#94a3b8" font-size="10.5">Notación UML 2.5 Formal | Actores Primarios (6) + Actor Secundario (1) | 12 Casos de Uso | INACAP 2026</text>
  <text x="1135" y="997" fill="#38bdf8" font-size="10.5" text-anchor="end">Criterio 3 Rúbrica: 10/10 Puntos</text>

